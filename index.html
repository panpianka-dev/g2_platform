<!doctype html>
<html lang="pl">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bohaterowie">
<meta name="theme-color" content="#121d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<title>Podwórkowi Bohaterowie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body { margin: 0; }
/* Layout: one centered game stage (canvas + HTML overlay screens), touch pad below on phones and tablets. */
:root {
  --bg: #121d12;
  --bg-deep: #0a120a;
  --panel: #23361f;
  --ink: #f6f3e4;
  --muted: #b8c7a6;
  --leaf: #9bd83f;
  --leaf-dark: #5a8f1c;
  --dew: #8fe3ff;
  --sun: #ffcf3f;
  --danger: #ff6a4d;
  --lock: #34452f;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--panel) 0%, var(--bg) 55%, var(--bg-deep) 100%);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
#stage {
  position: relative; width: 100%; aspect-ratio: 960 / 520; max-width: 100%;
  border-radius: 14px; overflow: hidden; background: #000;
  box-shadow: 0 0 0 3px #3a4f2a, 0 18px 40px rgba(0,0,0,.5);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
canvas { display: block; width: 100%; height: 100%; }
#overlay {
  position: absolute; inset: 0; display: flex; align-items: safe center; justify-content: center;
  background: linear-gradient(180deg, rgba(10,20,8,.55), rgba(10,20,8,.78));
  padding: 4%; box-sizing: border-box; text-align: center; overflow-y: auto;
}
#overlay[hidden] { display: none; }
.card { display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1.2vw, 12px); max-width: 100%; }
.eyebrow { font-size: clamp(11px, 1.6vw, 15px); letter-spacing: .14em; text-transform: uppercase; color: var(--sun); font-weight: 700; }
h1 {
  margin: 0; font-weight: 800; line-height: .92; text-wrap: balance; text-transform: uppercase; letter-spacing: .01em;
  font-size: clamp(28px, 7vw, 68px); color: #fff6d8;
  text-shadow: 0 3px 0 #b5641a, 0 6px 0 #6b3a10, 0 12px 22px rgba(0,0,0,.5);
}
h2 { margin: 0; font-weight: 800; font-size: clamp(22px, 4.6vw, 44px); line-height: 1; text-wrap: balance; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
.lede { margin: 0; font-size: clamp(13px, 2vw, 19px); color: var(--muted); max-width: 34em; font-weight: 500; line-height: 1.3; }
.hint { margin: 0; font-size: clamp(14px, 2.2vw, 21px); color: var(--ink); max-width: 32em; font-weight: 600; line-height: 1.3; }
.btn {
  font: inherit; font-weight: 800; font-size: clamp(15px, 2.4vw, 22px);
  border: 0; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: .03em;
  padding: .35em 1.2em .25em; color: #1f2a0b; background: var(--leaf);
  box-shadow: 0 5px 0 var(--leaf-dark); transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--leaf-dark); }
.btn.alt { background: #ece4c8; box-shadow: 0 5px 0 #a69d7c; }
.btn:focus-visible, .lvl:focus-visible, .chip:focus-visible, .pad:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(5px, 1vw, 10px); width: min(660px, 100%); }
.lvl {
  font: inherit; cursor: pointer; border: 0; border-radius: 10px; color: var(--ink);
  padding: clamp(3px, .8vw, 8px) 2px; display: flex; flex-direction: column; align-items: center;
  background: var(--w); box-shadow: 0 4px 0 rgba(0,0,0,.4); min-width: 0;
}
.lvl b { font-size: clamp(16px, 3vw, 28px); line-height: 1.05; }
.lvl span { font-size: clamp(8px, 1.2vw, 12px); font-weight: 600; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 3px; }
.lvl .drop { color: var(--dew); }
.lvl[disabled] { background: var(--lock); cursor: not-allowed; color: #7c8f73; box-shadow: none; }
.mode { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: clamp(12px, 1.8vw, 16px); font-weight: 700; color: var(--muted); }
.mode button { font: inherit; border: 0; border-radius: 999px; padding: .15em .9em; cursor: pointer; background: #2c3f26; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--sun); color: #2a1d02; }
.mode button.x[aria-pressed="true"] { background: var(--danger); color: #2a0a02; }
.stat { display: flex; gap: 18px; font-size: clamp(15px, 2.4vw, 22px); font-weight: 700; flex-wrap: wrap; justify-content: center; }
.stat em { font-style: normal; color: var(--dew); }
#chips { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.chip {
  font: inherit; font-weight: 700; font-size: clamp(10px, 1.5vw, 14px); cursor: pointer;
  border: 0; border-radius: 999px; padding: .2em .8em; color: var(--ink); background: rgba(10, 18, 8, .6);
}
#touch { display: none; justify-content: space-between; align-items: center; gap: 12px; }
[hidden] { display: none !important; }
.pads { display: flex; gap: 12px; align-items: center; }
.pad {
  font: inherit; font-weight: 800; font-size: 26px; width: 72px; height: 72px; border-radius: 50%;
  border: 0; color: var(--ink); background: #2e4428; box-shadow: 0 5px 0 #16220f; touch-action: none;
}
.pad.jump { width: 92px; height: 92px; background: #5f9a22; box-shadow: 0 5px 0 #355a10; font-size: 18px; }
.pad.atk { background: #b4542a; box-shadow: 0 5px 0 #6a2c12; font-size: 16px; }
.pad.held { transform: translateY(3px); box-shadow: 0 2px 0 #16220f; }
.help { margin: 0; color: var(--muted); font-size: 15px; text-align: center; line-height: 1.6; }
.help kbd { font-family: inherit; font-weight: 700; color: var(--ink); background: #2a3d24; border-radius: 6px; padding: 0 .45em; box-shadow: 0 2px 0 #111b0c; }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lvl span, .lede, .eyebrow, .help { display: none; }
  .pad { width: 62px; height: 62px; }
  .pad.jump { width: 80px; height: 80px; }
}
/* quiz */
.quiz { width: min(640px, 100%); gap: clamp(4px, 1.3vh, 10px); }
.qcat { font-size: clamp(11px, 1.5vw, 14px); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--dew); }
.qtext { margin: 0; font-size: clamp(17px, 3vw, 28px); line-height: 1.1; text-wrap: balance; }
.reward { margin: 0; font-size: clamp(12px, 1.8vw, 16px); color: var(--muted); font-weight: 600; }
.reward b { color: var(--sun); }
.staffwrap { width: min(250px, 55%); }
.staff { display: block; width: 100%; height: auto; background: #fbf6e6; border-radius: 10px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(5px, 1vw, 10px); width: 100%; }
.opt {
  font: inherit; font-weight: 800; font-size: clamp(15px, 2.3vw, 22px); position: relative; min-width: 0;
  border: 0; border-radius: 10px; padding: .35em .6em .25em; cursor: pointer;
  background: #ece4c8; color: #1f2a0b; box-shadow: 0 4px 0 #a69d7c;
}
.opt .num { position: absolute; top: 3px; left: 7px; font-size: 11px; opacity: .55; }
.opt.svgopt { padding: 4px; }
.opt.svgopt .staff { max-height: 21vh; width: auto; max-width: 100%; margin: 0 auto; }
.opt.ok { background: var(--leaf); box-shadow: 0 4px 0 var(--leaf-dark); }
.opt.bad { background: var(--danger); box-shadow: 0 4px 0 #8a2a1a; }
.opt[disabled] { cursor: default; }
.opt:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.verdict { margin: 0; font-weight: 800; font-size: clamp(15px, 2.4vw, 22px); line-height: 1.2; }
.verdict.ok { color: var(--leaf); }
.verdict.bad { color: #ffb19c; }
.gear { margin: 0; font-size: clamp(12px, 1.7vw, 15px); color: var(--muted); font-weight: 600; }
.gear b { color: var(--ink); }
/* phone / installed app: game fills the screen, controls float over the corners */
#rotate { display: none; }
html.touch, html.touch body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
html.touch body {
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex; align-items: center; justify-content: center; background: #000;
}
html.touch #app { max-width: none; width: 100%; height: 100%; justify-content: center; align-items: center; gap: 0; }
html.touch #stage {
  width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 960 / 520));
  border-radius: 0; box-shadow: none;
}
html.touch #touch {
  display: flex; position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding: 0 max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
html.touch .pad { pointer-events: auto; opacity: .5; }
html.touch .help { display: none; }
html.touch h1 { font-size: clamp(22px, 8vh, 56px); }
html.touch .lede { display: none; }
@media (orientation: portrait) {
  html.touch #rotate {
    display: flex; position: fixed; inset: 0; z-index: 50; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: var(--bg); color: var(--ink); font-size: 22px; font-weight: 800;
  }
  html.touch #rotate .phone { width: 64px; height: 110px; border: 5px solid var(--leaf); border-radius: 14px; transform: rotate(90deg); }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>

<div id="rotate"><div class="phone"></div><p>Obróć telefon poziomo, żeby grać</p></div>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="520" aria-label="Ekran gry"></canvas>
    <div id="chips">
      <button class="chip" id="pauseBtn" type="button">Pauza</button>
      <button class="chip" id="muteBtn" type="button">Dźwięk: wł.</button>
    </div>
    <div id="overlay"></div>
  </div>
  <div id="touch">
    <div class="pads">
      <button class="pad" id="tLeft" type="button" aria-label="W lewo">&#9664;</button>
      <button class="pad" id="tRight" type="button" aria-label="W prawo">&#9654;</button>
    </div>
    <div class="pads">
      <button class="pad atk" id="tAtk" type="button">CIOS</button>
      <button class="pad jump" id="tJump" type="button">SKOK</button>
    </div>
  </div>
  <p class="help"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> lub <kbd>A</kbd> <kbd>D</kbd> ruch &middot; <kbd>Spacja</kbd> lub <kbd>&uarr;</kbd> skok (przytrzymaj = wyżej) &middot; <kbd>X</kbd> lub <kbd>J</kbd> cios włócznią &middot; <kbd>P</kbd> pauza &middot; <kbd>M</kbd> dźwięk</p>
</div>

function buildLevel(idx) {
  const def = LEVELS[idx], W = def.w;
  const g = []; for (let r = 0; r < ROWS; r++) g.push(new Uint8Array(W));
  const L = { idx, def, name: def.name, world: def.world, w: W, grid: g, enemies: [], dews: [], hearts: [], checks: [], plats: [], rocks: [], goal: null, boss: !!def.boss };
  const inb = c => c >= 0 && c < W;
  const surf = c => { let r = ROWS - 1; if (isStand(g[r][c])) { while (r > 0 && isStand(g[r - 1][c])) r--; return r; } for (r = 0; r < ROWS; r++) if (isStand(g[r][c])) return r; return ROWS; };
  const api = {
    G(a, b, h = 2) { for (let c = a; c <= b; c++) if (inb(c)) for (let r = ROWS - h; r < ROWS; r++) g[r][c] = DIRT; },
    S(x, y, w, h) { for (let c = x; c < x + w; c++) for (let r = y; r < y + h; r++) if (inb(c) && r < ROWS) g[r][c] = STONE; L.rocks.push({ x: x * T, y: y * T, w: w * T, h: Math.min(h, ROWS - y) * T, seed: x * 31 + y }); },
    P(x, y, w) { for (let c = x; c < x + w; c++) if (inb(c)) g[y][c] = LEAF; },
    K(x, y, w) { L.plats.push({ kind: 'crumble', x: x * T, y: y * T, x0: x * T, y0: y * T, x1: x * T, y1: y * T, px: x * T, py: y * T, w: w * T, h: 16, state: 0, timer: 0, vy: 0 }); },
    B(x, y) { g[y === undefined ? surf(x) - 1 : y][x] = MUSH; },
    W(a, b) { for (let c = a; c <= b; c++) g[ROWS - 1][c] = WATER; },
    T(a, b) { for (let c = a; c <= b; c++) g[surf(c) - 1][c] = THORN; },
    D(x, y, n) { for (let i = 0; i < n; i++) L.dews.push({ x: (x + i) * T + T / 2, y: y * T + T / 2, got: false }); },
    H(x, y) { L.hearts.push({ x: x * T + T / 2, y: y * T + T / 2, got: false }); },
    E(type, x, y) {
      const d = EDIMS[type];
      const e = { type, name: d.name, w: d.w, h: d.h, hp: d.hp, maxHp: d.hp, base: d.speed, dmg: d.dmg, dir: -1, vx: 0, vy: 0, t: Math.random() * 6, dead: false, deadT: 0, hurtT: 0, inv: 0, kb: 0, kbDir: 0, showT: 0,
        cd: 1 + Math.random() * 2, pcd: 1.5, pvx: 0, mode: 'patrol', lastSwing: -1, onGround: false };
      e.x = x * T + T / 2 - d.w / 2;
      if (type === 'mosq') { e.y = y * T + T / 2 - d.h / 2; e.bx = e.x; e.by = e.y; e.range = 70; }
      else e.y = surf(x) * T - d.h;
      L.enemies.push(e);
    },
    M(x, y, w, dx, dy, spd) {
      const m = { kind: 'move', w: w * T, h: 16, x0: x * T, y0: y * T, x1: (x + dx) * T, y1: (y + dy) * T, t: 0, spd: spd * 1.15 };
      m.x = m.px = m.x0; m.y = m.py = m.y0; L.plats.push(m);
    },
    C(x) { const r = surf(x); L.checks.push({ col: x, x: x * T, y: r * T, on: false, wave: 0 }); },
    F(x) { const r = surf(x); L.goal = { x: x * T, y: r * T, hidden: !!def.boss, grow: def.boss ? 0 : 1 }; }
  };
  def.b(api);
  L.start = { x: 2 * T + (T - 28) / 2, y: surf(2) * T - 46 };
  // upgrade chests replace random dew drops, a new spot every attempt
  L.chests = [];
  const spots = L.dews.filter(d => d.x > 10 * T);
  for (let n = def.boss ? 1 : 2, tries = 0; L.chests.length < n && spots.length && tries < 40; tries++) {
    const d = spots[Math.floor(Math.random() * spots.length)];
    if (L.chests.some(c => Math.abs(c.x - d.x) < 12 * T)) continue;
    L.dews.splice(L.dews.indexOf(d), 1); spots.splice(spots.indexOf(d), 1);
    L.chests.push({ x: d.x, y: d.y - 4, got: false });
  }
  L.leafRuns = [];
  for (let r = 0; r < ROWS; r++) { let s = -1; for (let c = 0; c <= W; c++) { const on = c < W && g[r][c] === LEAF; if (on && s < 0) s = c; if (!on && s >= 0) { L.leafRuns.push({ r, a: s, b: c - 1 }); s = -1; } } }
  const rnd = mulberry(1000 + idx * 77);
  L.far = []; const spanF = W * T * 0.3 + VW + 300;
  for (let x = -100; x < spanF; x += 26 + rnd() * 34) L.far.push({ x, h: 330 + rnd() * 190, w: 30 + rnd() * 26, lean: (rnd() - 0.5) * 120, s: Math.floor(rnd() * 3) });
  L.mid = []; const spanM = W * T * 0.55 + VW + 300;
  for (let x = -100; x < spanM; x += 30 + rnd() * 46) {
    const k = rnd();
    L.mid.push({ x, kind: k < 0.12 ? 'clover' : k < 0.18 ? 'flower' : 'blade', h: 190 + rnd() * 220, w: 24 + rnd() * 22, lean: (rnd() - 0.5) * 100, s: Math.floor(rnd() * 3), dew: rnd() < 0.25, rot: rnd() * 6 });
  }
  L.front = []; const spanN = W * T * 1.15 + VW + 200;
  for (let x = -60; x < spanN; x += 40 + rnd() * 90) L.front.push({ x, h: 26 + rnd() * 34, w: 12 + rnd() * 10, lean: (rnd() - 0.5) * 30 });
  L.stars = []; for (let i = 0; i < 80; i++) L.stars.push({ x: rnd() * VW, y: rnd() * 280, r: 0.6 + rnd() * 1.6, p: rnd() * 6 });
  L.motes = []; for (let i = 0; i < 40; i++) L.motes.push({ x: rnd() * VW, y: rnd() * VH, p: rnd() * 6, s: 6 + rnd() * 14 });
  return L;
}

function tone(f1, f2, dur, type, vol, delay) {
  if (muted || !actx) return;
  const t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(gn); gn.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}

const keys = { left: false, right: false, jump: false };

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
const ATKKEYS = { KeyX: 1, KeyJ: 1, KeyK: 1, KeyF: 1, ControlLeft: 1, ShiftLeft: 1 };
addEventListener('keydown', e => {
  audio();
  const k = KEYMAP[e.code];
  if (k || e.code === 'ArrowDown') e.preventDefault();
  if (state === 'quiz' && /^Digit[1-4]$/.test(e.code)) { answerQuiz(+e.code.slice(5) - 1); return; }
  if (state !== 'play') {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { const b = overlay.querySelector('[data-primary]'); if (b) { e.preventDefault(); b.click(); } }
    if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'pause') resume();
    return;
  }
  if (k) { if (k === 'jump' && !keys.jump) jumpQueued = true; keys[k] = true; }
  if (ATKKEYS[e.code] && !e.repeat) atkQueued = true;
  if (e.code === 'KeyP' || e.code === 'Escape') pause();
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (state === 'play') pause(); });

function bindPad(id, k) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); audio(); if (k === 'atk') atkQueued = true; else { if (k === 'jump' && !keys.jump) jumpQueued = true; keys[k] = true; } el.classList.add('held'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const up = e => { e.preventDefault(); if (k !== 'atk') keys[k] = false; el.classList.remove('held'); };
  el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function hurt(d, fromX, kvy) {
  if (pl.inv > 0) return false;
  d = Math.max(1, Math.round(d * dmgMult() * (1 - ARMORS[save.armor].p)));
  pl.hp -= d; SFX.hurt(); shake = 0.25; addText('-' + d, pl.x + pl.w / 2, pl.y - 6, '#ff6a4d');
  if (pl.hp <= 0) { loseLife(); return true; }
  pl.inv = 1.0; pl.vy = kvy || -420; pl.vx = (pl.x + pl.w / 2 < fromX ? -1 : 1) * 320;
  return true;
}

  const d = Math.round(35 * dmgMult()); pl.hp -= d; shake = 0.25;

  state = 'complete'; SFX.win();

/* ---------- main loop ---------- */
let last = performance.now(), acc = 0;
const DT = 1 / 120;
function frame(now) {
  const el = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') { acc += el; while (acc >= DT && state === 'play') { step(DT); acc -= DT; } }
  else { acc = 0; if (L && state !== 'pause') { time += el; for (const p of particles) { p.t -= el; p.x += p.vx * el; p.y += p.vy * el; } } }
  render();
  requestAnimationFrame(frame);
}

// Development check: confirms every goal can be reached within the jump limits.
window.__checkLevels = function () {
  const out = [];
  for (let i = 0; i < LEVELS.length; i++) {
    const Lv = buildLevel(i), g = Lv.grid, W = Lv.w;
    const at = (c, r) => (c < 0 || c >= W) ? STONE : (r < 0 ? EMPTY : (r >= ROWS ? EMPTY : g[r][c]));
    const free = (c, r) => { const t = at(c, r); return !isSolid(t) && t !== WATER && t !== THORN; };
    const platCells = new Set();
    for (const m of Lv.plats) { for (let s = 0; s <= 12; s++) { const x = m.x0 + (m.x1 - m.x0) * s / 12, y = m.y0 + (m.y1 - m.y0) * s / 12; const r = Math.round(y / T) - 1; for (let c = Math.floor(x / T); c < Math.floor((x + m.w) / T); c++) platCells.add(c + ',' + r); } }
    const stand = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < W && free(c, r) && free(c, r - 1) && (isStand(at(c, r + 1)) || platCells.has(c + ',' + r));
    const startR = Math.round((Lv.start.y + 46) / T) - 1;
    const seen = new Set(['2,' + startR]), q = [[2, startR]];
    while (q.length) {
      const [c, r] = q.shift();
      const onMush = at(c, r + 1) === MUSH, up = onMush ? 8 : 3;
      for (let dr = -up; dr <= 12; dr++) {
        const maxDx = dr < 0 ? (onMush ? 5 : (dr === -3 ? 3 : 4)) : 5 + Math.floor(dr / 2);
        for (let dc = -maxDx; dc <= maxDx; dc++) { const k = (c + dc) + ',' + (r + dr); if (seen.has(k) || !stand(c + dc, r + dr)) continue; seen.add(k); q.push([c + dc, r + dr]); }
      }
    }
    const gc = Lv.goal.x / T, gr = Lv.goal.y / T - 1;
    let ok = false; for (let dc = -1; dc <= 1; dc++) if (seen.has((gc + dc) + ',' + gr)) ok = true;
    out.push({ level: i + 1, ok, missedChecks: Lv.checks.filter(c => !seen.has(c.col + ',' + (c.y / T - 1))).map(c => c.col), enemies: Lv.enemies.length });
  }
  return out;
};
window.__debug = { get state() { return state; }, get pl() { return pl; }, get L() { return L; }, startLevel, get lives() { return lives; }, get save() { return save; }, get quiz() { return quiz; }, openQuiz, answerQuiz };

function boot(data) {
  if (data && data.unlocked) save.unlocked = Math.max(save.unlocked, data.unlocked);
  showTitle();
  requestAnimationFrame(frame);
}
if ('serviceWorker' in navigator && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { window.claude?.hot?.snapshot?.(() => ({ unlocked: save.unlocked })); } catch (e) {}
const go = () => (window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {}));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go); else go();
})();
